version: '3.9'

services:
  chatbot-backend:
    build: .
    container_name: chatbot-ai-backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      PORT: 5000
      LLAMA_SERVER_URL: http://llama:8080
    depends_on:
      - llama
    restart: unless-stopped

  llama:
    image: ghcr.io/ggerganov/llama.cpp:latest
    container_name: llama-cpp-server
    ports:
      - "8080:8080"
    command: >
      -m /models/model.gguf
      --host 0.0.0.0
      --port 8080
      --ctx-size 4096
      --gpu-layers 35
    volumes:
      - ./models:/models
    restart: unless-stopped
